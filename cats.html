<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>12 隻慢慢畫出來的貓</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff;
    font-family: Arial, "Noto Sans TC", sans-serif;
    color: #222;
  }

  .page {
    width: min(1200px, 94vw);
    margin: 0 auto;
    padding: 32px 0 40px;
  }

  h1 {
    margin: 0 0 28px;
    text-align: center;
    font-size: clamp(24px, 3vw, 38px);
    font-weight: 700;
    letter-spacing: .04em;
  }

  .controls {
    display: flex;
    justify-content: center;
    margin: -12px 0 26px;
  }

  .replay-btn {
    border: 1.5px solid #111;
    background: #fff;
    color: #111;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }

  .replay-btn:hover {
    background: #f4f4f4;
  }

  .replay-btn:active {
    transform: scale(.97);
  }

  .cats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 24px;
  }

  .cat-card {
    min-height: 215px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .pose-name {
    margin-top: 8px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .05em;
  }

  svg {
    width: 100%;
    max-width: 210px;
    height: auto;
    overflow: visible;
  }

  .draw {
    fill: none;
    stroke: #111;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawLine 4s ease forwards;
    animation-delay: var(--delay);
  }

  .detail {
    stroke-width: 2.6;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  @media (max-width: 900px) {
    .cats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 620px) {
    .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .cat-card { min-height: 165px; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>慢慢畫出來的 12 隻貓</h1>

  <div class="controls">
    <button class="replay-btn" id="replayBtn" type="button">重來</button>
  </div>

    <!-- 12. 翻肚 -->
    <div class="cat-card" style="--delay:6.6s">
      <svg viewBox="0 0 200 180" aria-label="翻肚的貓">

  </div>
</div>

<script>
  function prepareDrawing() {
    document.querySelectorAll('.draw').forEach(el => {
      const length = Math.ceil(el.getTotalLength ? el.getTotalLength() : 1000);
      el.style.strokeDasharray = length;
      el.style.strokeDashoffset = length;
    });
  }

  function replayDrawing() {
    const lines = document.querySelectorAll('.draw');

    lines.forEach(el => {
      el.style.animation = 'none';
      el.style.strokeDashoffset = el.style.strokeDasharray;
    });

    void document.body.offsetWidth;

    lines.forEach(el => {
      el.style.animation = 'drawLine 4s ease forwards';
      el.style.animationDelay = 'var(--delay)';
    });
  }

  // DOM 建好後立刻先準備線條，再讓 CSS 動畫播放。
  document.addEventListener('DOMContentLoaded', () => {
    prepareDrawing();
    document.getElementById('replayBtn').addEventListener('click', replayDrawing);
  });
</script>
</body>
</html>
